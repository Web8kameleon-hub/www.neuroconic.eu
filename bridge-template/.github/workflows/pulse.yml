# PULSE - Neurosonic Ecosystem Heartbeat & Bridge
# 
# Ky workflow:
# 1. Dergon Pulse ne Neurosonic Core cdo commit
# 2. Dergon Heartbeat cdo 5 minuta
# 3. Verifikon Bridge lidhjen
# 4. Perditeson badge status

name: "Pulse - Bridge & Heartbeat"

on:
  push:
    branches: [ main, develop, master ]
  schedule:
    - cron: '*/5 * * * *'  # Heartbeat cdo 5 minuta
  workflow_dispatch:         # Manual trigger

jobs:
  bridge-check:
    name: "Bridge Connection Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Bridge Status
        run: |
          echo "🔗 Bridge: ACTIVE"
          echo "📡 Core: neurosonic.eu"
          echo "📦 Repo: ${{ github.repository }}"
      
      - name: Pulse Signal
        run: |
          echo "💓 Pulse: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "├── Repo: ${{ github.repository }}"
          echo "├── Commit: ${{ github.sha }}"
          echo "├── Branch: ${{ github.ref_name }}"
          echo "└── Status: ACTIVE"
      
      - name: Update Badge
        run: |
          echo "✅ Bridge + Pulse: OK"

  heartbeat:
    name: "Automatic Heartbeat"
    runs-on: ubuntu-latest
    needs: bridge-check
    steps:
      - name: Send Heartbeat
        run: |
          echo "💓 HEARTBEAT: ALIVE"
          echo "Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Bridge version: 1.0"
          echo "Status: OPERATIONAL"
