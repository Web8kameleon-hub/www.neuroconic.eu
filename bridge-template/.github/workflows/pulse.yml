name: Pulse - Neurosonic Ecosystem

on:
  push:
    branches: [ main, develop ]
  schedule:
    - cron: '*/5 * * * *'  # Cdo 5 minuta heartbeat

jobs:
  pulse:
    name: "Pulse Signal"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Send Pulse to Neurosonic Core
        run: |
          curl -X POST https://neurosonic.eu/api/pulse \
            -H "Content-Type: application/json" \
            -d '{
              "repo": "${{ github.repository }}",
              "status": "active",
              "commit": "${{ github.sha }}",
              "timestamp": "${{ github.event.head_commit.timestamp }}"
            }' || echo "Healthendje - Core offline, pulse lokal"

      - name: Update Pulse Badge
        run: |
          echo "Pulse derguar: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
