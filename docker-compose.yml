name: neurosonic

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "30m"
    volumes:
      - ollama-data:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  ollama-pull:
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull ${OLLAMA_MODEL:-qwen2.5:7b}"]

  lightning-spp:
    build:
      context: ./repos/Lightning-SPP-3.14
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      LIGHTNING_SPP_HOST: 0.0.0.0
      LIGHTNING_SPP_PORT: 8080
      LIGHTNING_SPP_MODE: production
      LIGHTNING_SPP_DB_PATH: /app/memory/spp_db.json
      NEUROSONIC_CORE: http://backend:8000
      ZERO_FAKE: "true"
    volumes:
      - spp-memory:/app/memory
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    depends_on:
      lightning-spp:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      NEUROSONIC_MODE: production
      LIGHTNING_SPP_URL: http://lightning-spp:8080
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://neurosonic.eu,https://www.neurosonic.eu}
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
    volumes:
      - backend-memory:/app/memory
      - backend-logs:/app/logs
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  backend_b:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    depends_on:
      lightning-spp:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      NEUROSONIC_MODE: production
      LIGHTNING_SPP_URL: http://lightning-spp:8080
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://neurosonic.eu,https://www.neurosonic.eu}
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
    volumes:
      - backend-memory:/app/memory
      - backend-logs:/app/logs
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      backend_b:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ${TLS_CERT_DIR:-./deploy/certs}:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

volumes:
  spp-memory:
  backend-memory:
  backend-logs:
  ollama-data:
