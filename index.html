<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neurosonic Trinity+ASI - UI Selector</title>
    <style>
        body {
            background: #0a0e1a;
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
            gap: 1rem;
        }
        .loading {
            width: 40px;
            height: 40px;
            border: 3px solid #1e3a5f;
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h1 {
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        p { color: #94a3b8; }
        .actions {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 0.5rem;
        }
        .btn {
            display: inline-block;
            border: 1px solid #1e3a5f;
            border-radius: 10px;
            padding: 0.65rem 1rem;
            color: #e2e8f0;
            text-decoration: none;
            transition: all 0.2s ease;
            background: #111827;
        }
        .btn:hover {
            border-color: #00d4ff;
            transform: translateY(-1px);
        }
        .btn.primary {
            background: linear-gradient(135deg, #0ea5e9, #7c3aed);
            border-color: transparent;
            color: white;
        }
    </style>
</head>
<body>
    <div class="loading"></div>
    <h1>NEUROSONIC TRINITY+ASI</h1>
    <p>Zgjidh UI që dëshiron të hapësh.</p>
    <div class="actions">
        <a class="btn primary" href="http://localhost:8000/dashboard">Dashboard API/Ops (backend)</a>
        <a class="btn" href="http://localhost:8000/dna-ui">DNA UI (backend)</a>
        <a class="btn" href="neurosonic_dashboard.html">Dashboard nga Frontend (5500)</a>
    </div>
</body>
</html>
