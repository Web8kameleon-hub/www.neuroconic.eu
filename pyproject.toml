[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neurosonic"
version = "1.0.0"
description = "NEUROSONIC TRINITY+ASI - Sovereign AI Platform. Zero dependencies, zero fake, absolute independence."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Neurosonic License v1.0 (Dual: MIT-like Core + Enterprise)"}
authors = [
    {name = "Ledjan Ahmati", email = "clisonix@pm.me"},
]
maintainers = [
    {name = "ABA GmbH", email = "clisonix@pm.me"},
]
keywords = ["ai", "sovereign-ai", "zero-dependencies", "no-fake", "clisonix", "trinity-asi", "neuromorphic", "hvo-memory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Natural Language :: Albanian",
    "Natural Language :: English",
    "Natural Language :: Greek",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.urls]
"Homepage" = "https://neurosonic.eu"
"Repository" = "https://github.com/Web8kameleon-hub/www.neurosonic.eu"
"Documentation" = "https://github.com/Web8kameleon-hub/www.neurosonic.eu/tree/main/docs"
"Funding" = "https://www.paypal.com/paypalme/ahmatibau"
"Bug Reports" = "https://github.com/Web8kameleon-hub/www.neurosonic.eu/issues"
"Changelog" = "https://github.com/Web8kameleon-hub/www.neurosonic.eu/blob/main/CHANGELOG.md"
"Sitemap" = "https://neurosonic.eu/sitemap.xml"

[project.scripts]
neurosonic = "neurosonic:main"
neurosonic-dna = "neurosonic_core:main"
neurosonic-no-fake-police = "neurosonic_no_fake_police:main"
neurosonic-shell = "neurosonic_shell:main"

[project.optional-dependencies]
backend = [
    "fastapi==0.139.2",
    "uvicorn==0.51.0",
    "pydantic==2.13.4",
]
dev = [
    "pytest==8.4.1",
    "ruff==0.12.10",
    "httpx>=0.28,<0.29",
]
public = [
    "fastapi==0.139.2",
    "uvicorn==0.51.0",
    "pydantic==2.13.4",
    "pytest==8.4.1",
    "httpx>=0.28,<0.29",
]

[tool.setuptools.packages.find]
include = ["neurosonic*"]

[tool.setuptools.package-data]
neurosonic = ["docs/**/*", "memory/**/*"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.format]
quote-style = "double"
indent-width = 4
